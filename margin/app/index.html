<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Margin — an AI peer-review copilot for academic papers. Reviewer-style feedback on writing, structure, methodology, novelty and citations." />
    <title>Margin — Peer-Review Copilot</title>
    <script>
      // apply the stored/system theme before first paint (no flash)
      (function () {
        try {
          var pref = localStorage.getItem("margin-theme");
          var dark = pref === "dark" ||
            ((pref === null || pref === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) { /* default to light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
